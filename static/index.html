<!DOCTYPE html>
<html>
    <head>
        <title>OSM Map - Leaflet</title>

        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <script src="/leaflet.js"></script>
        <link href="/leaflet.css" rel="stylesheet" />

        <style>
            html, body, #map {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
            }
        </style>
    </head>

    <body>
        <div id="map"></div>

        <script>
            const map = L.map("map", {
                center: [51.1657, 10.4515],
                zoom: 6,
                zoomSnap: 1
            });

            L.tileLayer("/tile/{z}/{x}/{y}.png", {
                tileSize: 256,
                minZoom: 0,
                maxZoom: 22,
                attribution:
                    'Map data &copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors'
            }).addTo(map);

            L.control.scale().addTo(map);
            map.whenReady(() => {
                map.invalidateSize();
            });
        </script>
    </body>
</html>
